<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0d10"><title>COYOTE REMOTE WEB</title><style>html,body{margin:0;min-height:100%;background:#0a0d10;color:#f3f6f8;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}main{min-height:100vh;display:grid;place-items:center;padding:24px}.box{max-width:420px;text-align:center}.mark{width:52px;height:52px;margin:0 auto 16px;border-radius:15px;display:grid;place-items:center;background:#6ee7bd;color:#071014;font-weight:900}p{color:#8d99a4;font-size:13px}#err{color:#ff8b95;white-space:pre-wrap}</style></head><body><main><div class="box"><div class="mark">CR</div><strong>COYOTE REMOTE</strong><p id="status">Loading v0.1.9…</p><p id="err"></p></div></main><script>(async()=>{const parts=["./bundle/p01.txt","./bundle/p02.txt","./bundle/p03.txt","./bundle/p04.txt","./bundle/p05.txt","./bundle/p06.txt","./bundle/p07.txt","./bundle/p08.txt","./bundle/p09.txt","./bundle/p10.txt","./bundle/p11.txt","./bundle/p12.txt","./bundle/p13.txt","./bundle/p14.txt","./bundle/p15.txt","./bundle/p16.txt","./bundle/p17.txt","./bundle/p18.txt","./bundle/p19.txt","./bundle/p20.txt","./bundle/p21.txt","./bundle/p22.txt","./bundle/p23.txt","./bundle/p24.txt","./bundle/p25.txt","./bundle/p26.txt","./bundle/p27.txt","./bundle/p28.txt","./bundle/p29.txt","./bundle/p30.txt"];try{const texts=await Promise.all(parts.map(async p=>{const r=await fetch(p,{cache:'no-cache'});if(!r.ok)throw new Error(p+' '+r.status);return r.text()}));const raw=atob(texts.join('').replace(/\s+/g,''));const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));if(!('DecompressionStream'in window))throw new Error('Use current Chrome or Edge.');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('status').textContent='起動に失敗しました';document.getElementById('err').textContent=String(e&&e.stack||e)}})();</script></body></html>
