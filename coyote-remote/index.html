(()=>{const NativeBC=window.BroadcastChannel;if(!NativeBC)return;let seq=0;class WANBC{
constructor(name){this.name=name;this.onmessage=null;this._closed=false;this._seen=new Set();this._seenQ=[];this._queue=[];this._conns=new Map();this._hostConn=null;this._peer=null;this._role=null;this._room=(String(name).match(/:(\\d{6})$/)||[])[1]||'';this._local=new NativeBC(name);this._local.onmessage=e=>this._deliver(e.data);this._retry=null;this._connectRetry=null;this._retryCount=0;this._started=0;this._peerGen=0;this._lastError=''}

_infer(msg){if(this._role)return;if(['HOST_STATE','HOST_HELLO','AUTH','DEAUTH','KICK','COMMAND_ACK'].includes(msg?.type))this._role='host';else if(msg?.type==='HELLO')this._role=msg.role==='viewer'?'viewer':'controller';if(this._role)this._startPeer()}

}window.BroadcastChannel=WANBC;window.__estimUiPatch=()=>{const replaceText=root=>{const w=document.createTreeWalker(root||document.body,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode())if(n.nodeValue&&n.nodeValue.includes('COYOTE'))n.nodeValue=n.nodeValue.replaceAll('COYOTE','E-STIM');document.querySelectorAll('[title],[aria-label]').forEach(el=>{for(const a of ['title','aria-label']){const v=el.getAttribute(a);if(v&&v.includes('COYOTE'))el.setAttribute(a,v.replaceAll('COYOTE','E-STIM'))}});document.title='E-STIM REMOTE WEB'};const addGuide=(panel,title,items)=>{const p=document.querySelector(panel);if(!p||p.querySelector('.estim-howto'))return;const g=document.createElement('details');g.className='estim-howto';g.open=true;g.innerHTML='<summary>'+title+'</summary><ol>'+items.map(x=>'<li>'+x+'</li>').join('')+'</ol>';const anchor=p.querySelector('.setup-guide');(anchor||p.firstElementChild)?.insertAdjacentElement('afterend',g)};const style=document.createElement('style');style.textContent='.estim-howto{margin:10px 0;border:1px solid var(--line,#26313a);border-radius:12px;background:rgba(127,127,127,.05);padding:10px 12px}.estim-howto summary{font-weight:800;cursor:pointer}.estim-howto ol{margin:9px 0 2px;padding-left:22px;line-height:1.7;font-size:12px}.estim-wan-chip{position:fixed;right:12px;bottom:72px;z-index:9998;padding:7px 10px;border-radius:999px;background:#10161b;border:1px solid #34414c;font:700 11px system-ui;color:#9fb0bd}.estim-wan-chip.online{border-color:#43c69f;color:#67deb8}.estim-wan-chip.warn{border-color:#d59d45;color:#efbf6d}';document.head.appendChild(style);addGuide('#hostPanel','受信側のあそびかた',['E-STIMデバイスを接続します。','ROOMを開始し、QRコード / URLを相手へ共有します。','届いた接続申請を許可します。','実機出力は REAL REMOTE READY を押してから開始します。','LIMIT / ALL ZERO / E-STOP は受信側が最終権限です。']);addGuide('#controllerPanel','送信側のあそびかた',['QRコードを読むかROOM CODEを入力します。','表示名を確認して「接続を申請する」を押します。','受信側の許可後にE-STIM A/Bを操作できます。','別の送信側へ操作権が移った場合はROOM内で待機します。']);addGuide('#viewerPanel','閲覧側のあそびかた',['ROOM CODEを
